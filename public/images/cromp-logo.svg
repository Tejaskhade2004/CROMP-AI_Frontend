<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer geometric shapes -->
  <g opacity="0.9">
    <!-- Large triangle top-left -->
    <polygon points="60,40 100,20 90,70" fill="url(#purpleGradient)" />
    
    <!-- Triangle top-right -->
    <polygon points="140,30 170,50 130,80" fill="url(#blueGradient)" />
    
    <!-- Triangle bottom-right -->
    <polygon points="150,140 180,160 140,170" fill="url(#orangeGradient)" />
    
    <!-- Triangle bottom-left -->
    <polygon points="50,150 80,180 40,160" fill="url(#purpleGradient)" opacity="0.8" />
  </g>
  
  <!-- Center circle with gradient border -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="url(#blueGradient)" stroke-width="3" opacity="0.8" />
  
  <!-- Inner decorative circles -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="url(#purpleGradient)" stroke-width="1.5" opacity="0.5" />
  
  <!-- Connecting lines for tech feel -->
  <line x1="70" y1="70" x2="130" y2="130" stroke="url(#blueGradient)" stroke-width="2" opacity="0.6" />
  <line x1="130" y1="70" x2="70" y2="130" stroke="url(#orangeGradient)" stroke-width="2" opacity="0.6" />
  
  <!-- Center tech symbol (C letter style) -->
  <path d="M 85 100 A 15 15 0 1 1 85 85" fill="none" stroke="url(#purpleGradient)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Accent dots -->
  <circle cx="115" cy="85" r="2.5" fill="url(#blueGradient)" />
  <circle cx="120" cy="115" r="2.5" fill="url(#orangeGradient)" />
  <circle cx="80" cy="120" r="2.5" fill="url(#purpleGradient)" />
</svg>